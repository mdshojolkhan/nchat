<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>N-Chat | Global Community Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e1b4b 50%,
                #31103f 100%
            );
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass {
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.2);
        }

        .glass-dark {
            background: rgba(15,23,42,.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.2);
            border-radius: 10px;
        }

        input {
            color-scheme: dark;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="flex items-center justify-center p-0 sm:p-4">

<div id="app"
     class="w-full max-w-md h-[100dvh] sm:h-[800px] sm:rounded-3xl
            shadow-2xl overflow-hidden relative flex flex-col glass-dark">

    <!-- SPLASH SCREEN -->

    <div id="screen-splash"
         class="absolute inset-0 flex flex-col items-center justify-center
                z-50 bg-gradient-to-br from-slate-900 via-indigo-950
                to-purple-950">

        <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr
                    from-cyan-500 to-indigo-600 flex items-center
                    justify-center shadow-lg mb-6 animate-pulse">

            <i class="fa-solid fa-comments text-4xl text-white"></i>
        </div>

        <h1 class="text-3xl font-bold tracking-wider
                   bg-gradient-to-r from-cyan-400 to-purple-400
                   bg-clip-text text-transparent">
            N-CHAT
        </h1>

        <p class="text-xs text-slate-400 mt-2 tracking-widest uppercase">
            Global Community Chat
        </p>
    </div>


    <!-- AUTH SCREEN -->

    <div id="screen-auth"
         class="absolute inset-0 flex flex-col justify-center p-6 z-40 hidden">

        <div class="text-center mb-8">
            <h2 id="auth-title" class="text-2xl font-bold">
                Welcome Back
            </h2>

            <p id="auth-subtitle" class="text-sm text-slate-400 mt-1">
                Sign in to continue to N-Chat
            </p>
        </div>

        <form id="auth-form" class="space-y-4">

            <!-- Name -->

            <div id="name-group" class="hidden">
                <label class="block text-xs uppercase text-slate-400 mb-1">
                    Your Name
                </label>

                <input id="auth-name"
                       type="text"
                       maxlength="50"
                       placeholder="Enter your name"
                       class="w-full p-3 rounded-xl glass text-sm outline-none">
            </div>

            <!-- Username -->

            <div id="username-group" class="hidden">
                <label class="block text-xs uppercase text-slate-400 mb-1">
                    Username
                </label>

                <input id="auth-username"
                       type="text"
                       maxlength="24"
                       pattern="[A-Za-z0-9_]{3,24}"
                       placeholder="e.g. shojol_khan"
                       class="w-full p-3 rounded-xl glass text-sm outline-none">

                <p class="text-xs text-slate-500 mt-1">
                    3–24 characters: letters, numbers, underscore.
                </p>
            </div>

            <!-- Email -->

            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">
                    Email Address
                </label>

                <input id="auth-email"
                       type="email"
                       required
                       autocomplete="email"
                       placeholder="you@example.com"
                       class="w-full p-3 rounded-xl glass text-sm outline-none">
            </div>

            <!-- Password -->

            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">
                    Password
                </label>

                <input id="auth-password"
                       type="password"
                       required
                       minlength="6"
                       autocomplete="current-password"
                       placeholder="At least 6 characters"
                       class="w-full p-3 rounded-xl glass text-sm outline-none">
            </div>

            <button id="auth-btn"
                    type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r
                           from-cyan-500 to-indigo-600 font-semibold">
                Sign In
            </button>

        </form>

        <p id="auth-error"
           class="text-sm text-rose-300 mt-4 text-center hidden"
           role="alert"></p>

        <div class="text-center mt-6">
            <button id="auth-toggle"
                    type="button"
                    class="text-xs text-cyan-400">
                Don't have an account? Sign Up
            </button>
        </div>
    </div>


    <!-- MAIN APP -->

    <div id="screen-main" class="flex flex-col h-full hidden z-30">

        <!-- HEADER -->

        <header class="flex items-center justify-between p-3 glass">

            <div class="flex items-center gap-3 min-w-0">
                <div id="nav-avatar"
                     class="w-10 h-10 shrink-0 rounded-full bg-gradient-to-tr
                            from-cyan-500 to-purple-600 flex items-center
                            justify-center font-bold">
                    N
                </div>

                <div class="min-w-0">
                    <h3 id="nav-name" class="font-bold text-sm truncate">
                        N-Chat User
                    </h3>

                    <span class="text-xs text-emerald-400">
                        ● Connected
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-1">

                <button id="chat-tab-button"
                        type="button"
                        onclick="switchTab('chat')"
                        aria-label="Chat"
                        class="p-2 rounded-xl text-cyan-400">
                    <i class="fa-solid fa-comments text-lg"></i>
                </button>

                <button id="profile-tab-button"
                        type="button"
                        onclick="switchTab('profile')"
                        aria-label="Profile"
                        class="p-2 rounded-xl text-slate-400">
                    <i class="fa-solid fa-user-gear text-lg"></i>
                </button>

                <button id="logout-button"
                        type="button"
                        aria-label="Logout"
                        class="p-2 rounded-xl text-rose-400">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>

            </div>
        </header>


        <!-- CONTENT -->

        <div class="flex-1 overflow-hidden relative">

            <!-- CHAT TAB -->

            <section id="tab-chat"
                     class="absolute inset-0 flex flex-col">

                <div id="chat-status"
                     class="text-center text-xs text-slate-400 p-2">
                    Connecting to chat...
                </div>

                <div id="chat-messages"
                     class="flex-1 overflow-y-auto p-4 space-y-3">

                    <p class="text-center text-xs text-slate-500 py-10">
                        Loading messages...
                    </p>

                </div>

                <form id="chat-form"
                      class="p-3 glass flex items-center gap-2">

                    <input id="chat-input"
                           type="text"
                           maxlength="2000"
                           required
                           autocomplete="off"
                           placeholder="Type a message..."
                           class="flex-1 min-w-0 p-3 rounded-xl glass
                                  text-sm outline-none">

                    <button id="send-button"
                            type="submit"
                            aria-label="Send message"
                            class="w-11 h-11 shrink-0 rounded-xl
                                   bg-gradient-to-r from-cyan-500
                                   to-indigo-600">

                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>

            </section>


            <!-- PROFILE TAB -->

            <section id="tab-profile"
                     class="absolute inset-0 p-6 overflow-y-auto hidden">

                <div class="text-center mb-6">

                    <div id="profile-avatar"
                         class="w-20 h-20 rounded-full bg-gradient-to-tr
                                from-cyan-500 to-purple-600 flex items-center
                                justify-center text-2xl font-bold mx-auto mb-3">
                        N
                    </div>

                    <h3 id="profile-name"
                        class="text-lg font-bold">
                        Name
                    </h3>

                    <p id="profile-username"
                       class="text-xs text-slate-400">
                        @username
                    </p>

                    <p id="profile-email"
                       class="text-xs text-slate-500 mt-1"></p>
                </div>

                <div class="glass p-4 rounded-2xl">

                    <h4 class="text-xs font-semibold text-cyan-400 mb-4">
                        ACCOUNT SETTINGS
                    </h4>

                    <form id="profile-form" class="space-y-4">

                        <div>
                            <label class="block text-xs text-slate-400 mb-1">
                                Update Name
                            </label>

                            <input id="profile-name-input"
                                   type="text"
                                   maxlength="50"
                                   required
                                   class="w-full p-3 rounded-xl glass text-sm outline-none">
                        </div>

                        <div>
                            <label class="block text-xs text-slate-400 mb-1">
                                New Password
                            </label>

                            <input id="profile-password-input"
                                   type="password"
                                   minlength="6"
                                   autocomplete="new-password"
                                   placeholder="Leave blank to keep current"
                                   class="w-full p-3 rounded-xl glass text-sm outline-none">
                        </div>

                        <button id="save-profile-button"
                                type="submit"
                                class="w-full py-3 rounded-xl
                                       bg-cyan-500/20 border border-cyan-500/30
                                       text-cyan-300 font-semibold">
                            Save Changes
                        </button>

                    </form>
                </div>

            </section>

        </div>
    </div>


    <!-- NOTIFICATION -->

    <div id="notification"
         role="status"
         class="absolute bottom-16 left-4 right-4 z-[60] hidden
                rounded-xl bg-slate-900 border border-white/10
                p-3 text-sm">
    </div>

</div>


<!-- FIREBASE APPLICATION -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
        updatePassword
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        collection,
        addDoc,
        query,
        orderBy,
        limit,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


    // YOUR FIREBASE CONFIGURATION

    const firebaseConfig = {
        apiKey: "AIzaSyCIiPD7vmuJHFKYVn1yDCpK0R1YC_cRnio",
        authDomain: "nchat-2cc6e.firebaseapp.com",
        projectId: "nchat-2cc6e",
        storageBucket: "nchat-2cc6e.firebasestorage.app",
        messagingSenderId: "1030278616296",
        appId: "1:1030278616296:web:9b7e7887a75c870334e55d",
        measurementId: "G-BPPZL87K1H"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    let isSignUp = false;
    let currentUser = null;
    let userProfile = null;
    let stopMessagesListener = null;
    let notificationTimer = null;


    // NOTIFICATIONS

    function notify(message, error = false) {
        const box = $("notification");

        box.textContent = message;
        box.classList.remove("hidden", "text-rose-300", "text-emerald-300");
        box.classList.add(error ? "text-rose-300" : "text-emerald-300");

        clearTimeout(notificationTimer);

        notificationTimer = setTimeout(() => {
            box.classList.add("hidden");
        }, 4000);
    }


    function showAuthError(message) {
        $("auth-error").textContent = message;
        $("auth-error").classList.remove("hidden");
    }


    function friendlyError(error) {
        const messages = {
            "auth/email-already-in-use":
                "This email is already registered. Please sign in.",

            "auth/invalid-email":
                "Please enter a valid email address.",

            "auth/weak-password":
                "Password must contain at least 6 characters.",

            "auth/invalid-credential":
                "Email or password is incorrect.",

            "auth/user-not-found":
                "No account found. Please sign up first.",

            "auth/wrong-password":
                "Email or password is incorrect.",

            "auth/too-many-requests":
                "Too many attempts. Please wait and try again.",

            "auth/network-request-failed":
                "Network error. Check your internet connection.",

            "auth/requires-recent-login":
                "Please sign out and sign in again before changing your password.",

            "permission-denied":
                "Database access denied. Check Firestore Security Rules."
        };

        return messages[error?.code] || error?.message ||
            "Something went wrong. Please try again.";
    }


    // LOGIN / SIGNUP MODE

    function setAuthMode(signUp) {
        isSignUp = signUp;

        $("auth-error").classList.add("hidden");
        $("auth-form").reset();

        $("name-group").classList.toggle("hidden", !signUp);
        $("username-group").classList.toggle("hidden", !signUp);

        $("auth-name").required = signUp;
        $("auth-username").required = signUp;

        $("auth-title").textContent =
            signUp ? "Create Account" : "Welcome Back";

        $("auth-subtitle").textContent =
            signUp
                ? "Join the N-Chat community"
                : "Sign in to continue to N-Chat";

        $("auth-btn").textContent =
            signUp ? "Create Account" : "Sign In";

        $("auth-toggle").textContent =
            signUp
                ? "Already have an account? Sign In"
                : "Don't have an account? Sign Up";

        $("auth-password").autocomplete =
            signUp ? "new-password" : "current-password";
    }


    $("auth-toggle").addEventListener("click", () => {
        setAuthMode(!isSignUp);
    });


    // AUTHENTICATION

    $("auth-form").addEventListener("submit", async event => {
        event.preventDefault();

        $("auth-error").classList.add("hidden");
        $("auth-btn").disabled = true;

        try {
            const email = $("auth-email").value.trim().toLowerCase();
            const password = $("auth-password").value;

            if (isSignUp) {

                const name = $("auth-name").value.trim();

                const username =
                    $("auth-username").value.trim().toLowerCase();

                if (!name) {
                    throw new Error("Please enter your name.");
                }

                if (!/^[a-z0-9_]{3,24}$/.test(username)) {
                    throw new Error(
                        "Username must contain 3–24 letters, numbers or underscores."
                    );
                }

                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                await setDoc(
                    doc(db, "users", credential.user.uid),
                    {
                        uid: credential.user.uid,
                        name: name,
                        username: username,
                        email: email,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    }
                );

            } else {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            }

        } catch (error) {
            showAuthError(friendlyError(error));
        } finally {
            $("auth-btn").disabled = false;
        }
    });


    // SESSION LISTENER

    onAuthStateChanged(auth, async user => {

        currentUser = user;

        if (!user) {
            userProfile = null;

            if (stopMessagesListener) {
                stopMessagesListener();
                stopMessagesListener = null;
            }

            $("screen-main").classList.add("hidden");
            $("screen-auth").classList.remove("hidden");
            $("screen-splash").classList.add("hidden");

            return;
        }

        try {

            const profileRef = doc(db, "users", user.uid);
            const profileSnapshot = await getDoc(profileRef);

            if (!profileSnapshot.exists()) {
                throw new Error(
                    "Your user profile was not found. Contact support."
                );
            }

            userProfile = profileSnapshot.data();

            initMainApp();

        } catch (error) {

            $("screen-main").classList.add("hidden");
            $("screen-auth").classList.remove("hidden");
            $("screen-splash").classList.add("hidden");

            showAuthError(
                "Could not load your profile. " + friendlyError(error)
            );
        }
    });


    // INITIALIZE MAIN APP

    function initMainApp() {

        $("screen-splash").classList.add("hidden");
        $("screen-auth").classList.add("hidden");
        $("screen-main").classList.remove("hidden");

        const name = userProfile.name || "N-Chat User";
        const username = userProfile.username || "user";

        $("nav-name").textContent = name;
        $("nav-avatar").textContent = name.charAt(0).toUpperCase();

        $("profile-name").textContent = name;
        $("profile-username").textContent = "@" + username;
        $("profile-avatar").textContent = name.charAt(0).toUpperCase();
        $("profile-email").textContent = currentUser.email || "";

        $("profile-name-input").value = name;
        $("profile-password-input").value = "";

        startMessagesListener();
        window.switchTab("chat");
    }


    // LOGOUT

    $("logout-button").addEventListener("click", async () => {

        try {
            await signOut(auth);
            notify("You have signed out.");
        } catch (error) {
            notify(friendlyError(error), true);
        }
    });


    // TAB SWITCHING

    window.switchTab = function(tab) {

        const chatActive = tab === "chat";

        $("tab-chat").classList.toggle("hidden", !chatActive);
        $("tab-profile").classList.toggle("hidden", chatActive);

        $("chat-tab-button").classList.toggle(
            "text-cyan-400", chatActive
        );

        $("chat-tab-button").classList.toggle(
            "text-slate-400", !chatActive
        );

        $("profile-tab-button").classList.toggle(
            "text-cyan-400", !chatActive
        );

        $("profile-tab-button").classList.toggle(
            "text-slate-400", chatActive
        );

        if (chatActive) {
            scrollToBottom();
        }
    };


    // REAL-TIME FIRESTORE CHAT

    function startMessagesListener() {

        if (stopMessagesListener) {
            stopMessagesListener();
        }

        $("chat-messages").replaceChildren();

        $("chat-status").textContent = "Connecting to live chat...";

        const messagesQuery = query(
            collection(db, "messages"),
            orderBy("createdAt", "asc"),
            limit(100)
        );

        stopMessagesListener = onSnapshot(
            messagesQuery,

            snapshot => {

                const container = $("chat-messages");
                container.replaceChildren();

                if (snapshot.empty) {

                    const empty = document.createElement("p");

                    empty.className =
                        "text-center text-xs text-slate-500 py-10";

                    empty.textContent =
                        "No messages yet. Start the conversation!";

                    container.appendChild(empty);

                } else {

                    snapshot.forEach(messageDoc => {

                        const msg = messageDoc.data();

                        const isMe =
                            msg.uid === currentUser?.uid;

                        const wrapper =
                            document.createElement("div");

                        wrapper.className =
                            "flex flex-col " +
                            (isMe ? "items-end" : "items-start") +
                            " mb-2";

                        const sender =
                            document.createElement("span");

                        sender.className =
                            "text-[10px] text-slate-400 mb-1 px-1";

                        sender.textContent =
                            isMe ? "You" : (msg.name || "N-Chat User");

                        const bubble =
                            document.createElement("div");

                        bubble.className =
                            "max-w-[85%] break-words whitespace-pre-wrap " +
                            "px-4 py-2.5 rounded-2xl text-sm " +
                            (
                                isMe
                                    ? "bg-gradient-to-r from-cyan-500 " +
                                      "to-indigo-600 text-white rounded-br-none"
                                    : "glass text-slate-200 rounded-bl-none"
                            );

                        // textContent prevents HTML/script injection.
                        bubble.textContent =
                            typeof msg.text === "string" ? msg.text : "";

                        const time =
                            document.createElement("span");

                        time.className =
                            "text-[9px] text-slate-500 mt-1 px-1";

                        time.textContent =
                            msg.createdAt?.toDate
                                ? msg.createdAt.toDate().toLocaleTimeString(
                                    [],
                                    {
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    }
                                )
                                : "Sending...";

                        wrapper.append(sender, bubble, time);
                        container.appendChild(wrapper);
                    });
                }

                $("chat-status").textContent =
                    "Live chat • Latest 100 messages";

                scrollToBottom();
            },

            error => {

                $("chat-status").textContent =
                    "Chat connection failed.";

                notify(friendlyError(error), true);
            }
        );
    }


    // SEND MESSAGE

    $("chat-form").addEventListener("submit", async event => {

        event.preventDefault();

        const text = $("chat-input").value.trim();

        if (!text || !currentUser || !userProfile) {
            return;
        }

        $("send-button").disabled = true;

        try {

            await addDoc(collection(db, "messages"), {

                uid: currentUser.uid,

                username: userProfile.username || "",

                name: userProfile.name || "N-Chat User",

                text: text,

                createdAt: serverTimestamp()

            });

            $("chat-input").value = "";

        } catch (error) {

            notify(friendlyError(error), true);

        } finally {

            $("send-button").disabled = false;
            $("chat-input").focus();
        }
    });


    // UPDATE PROFILE / PASSWORD

    $("profile-form").addEventListener("submit", async event => {

        event.preventDefault();

        if (!currentUser || !userProfile) {
            return;
        }

        const newName =
            $("profile-name-input").value.trim();

        const newPassword =
            $("profile-password-input").value;

        if (!newName) {
            notify("Name cannot be empty.", true);
            return;
        }

        if (newPassword && newPassword.length < 6) {
            notify(
                "New password must contain at least 6 characters.",
                true
            );
            return;
        }

        $("save-profile-button").disabled = true;

        try {

            await updateDoc(
                doc(db, "users", currentUser.uid),
                {
                    name: newName,
                    updatedAt: serverTimestamp()
                }
            );

            if (newPassword) {
                await updatePassword(currentUser, newPassword);
            }

            userProfile.name = newName;

            initMainApp();

            notify("Profile updated successfully.");

        } catch (error) {

            notify(friendlyError(error), true);

        } finally {

            $("save-profile-button").disabled = false;
        }
    });


    function scrollToBottom() {
        const container = $("chat-messages");
        container.scrollTop = container.scrollHeight;
    }


    // SPLASH SCREEN

    window.addEventListener("load", () => {

        setTimeout(() => {

            $("screen-splash").style.transition = "opacity .4s";
            $("screen-splash").style.opacity = "0";

            setTimeout(() => {
                $("screen-splash").classList.add("hidden");
            }, 400);

        }, 700);
    });

</script>

</body>
</html>
