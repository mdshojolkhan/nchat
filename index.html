<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b12">
  <title>N-Chat — Global Community</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #0b0b12;
      --panel: #151521;
      --border: #29293b;
      --accent: #8b5cf6;
      --text: #f4f4f8;
      --muted: #9999ad;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #24153e 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(100% - 28px, 480px);
      margin: 0 auto;
      padding: 24px 0;
    }

    .brand {
      text-align: center;
      margin: 16px 0 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      box-shadow: 0 10px 35px #7c3aed35;
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #151521ed;
      box-shadow: 0 20px 60px #0003;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .field {
      margin: 15px 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #c9c9d8;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      color: white;
      background: #0e0e18;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(110deg, #8b5cf6, #6d28d9);
      color: white;
      font-weight: 700;
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: #252538;
      margin-top: 10px;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .switch button {
      color: #c4b5fd;
      border: 0;
      background: transparent;
      font-weight: 700;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .error {
      color: #fda4af;
    }

    .success {
      color: #86efac;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .topbar h2 {
      margin: 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #183a2c;
      color: #86efac;
      font-size: 11px;
    }

    .profile {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #151521;
    }

    .chatbox {
      height: min(48vh, 430px);
      min-height: 250px;
      overflow-y: auto;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #0e0e18;
    }

    .message {
      margin-bottom: 12px;
      padding: 11px;
      border: 1px solid #29293b;
      border-radius: 12px;
      background: #191927;
      overflow-wrap: anywhere;
    }

    .message .author {
      margin-bottom: 5px;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 700;
    }

    .message .body {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    .message .time {
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .composer {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .composer input {
      min-width: 0;
      flex: 1;
    }

    .send {
      width: 58px;
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      color: #77778b;
      font-size: 11px;
      margin: 22px 0 8px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <div class="logo">N</div>
      <h1>N-Chat</h1>
      <div class="muted">Your world. Your community.</div>
    </header>

    <section id="authView" class="card">
      <h2 id="authTitle">Welcome Back</h2>
      <p class="muted" id="authSubtitle">
        Sign in to your community.
      </p>

      <form id="authForm">
        <div id="nameField" class="field hidden">
          <label for="displayName">Profile name</label>
          <input id="displayName" maxlength="40"
                 autocomplete="name" placeholder="Your name">
        </div>

        <div id="usernameField" class="field hidden">
          <label for="username">Username</label>
          <input id="username" maxlength="20"
                 autocomplete="username" placeholder="your_username">
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" required
                 maxlength="254" autocomplete="email"
                 placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required
                 minlength="6" autocomplete="current-password"
                 placeholder="At least 6 characters">
        </div>

        <button id="submitBtn" class="btn" type="submit">
          Sign In
        </button>
      </form>

      <div class="switch">
        <span id="switchText">New to N-Chat?</span>
        <button id="switchBtn" type="button">Create Account</button>
      </div>

      <div id="authStatus" class="status" role="status"></div>
    </section>

    <section id="chatView" class="hidden">
      <div class="topbar">
        <h2>Community Chat</h2>
        <button id="logoutBtn" class="btn"
                style="width:auto;padding:9px 13px">
          Logout
        </button>
      </div>

      <div class="profile">
        <div id="welcomeName" style="font-weight:700">
          Welcome
        </div>
        <div id="welcomeUsername" class="muted"></div>
        <div style="margin-top:9px">
          <span class="badge">● Connected</span>
        </div>
      </div>

      <div id="chatMessages" class="chatbox"
           aria-live="polite">
        <p class="muted">Loading messages...</p>
      </div>

      <form id="messageForm" class="composer">
        <input id="messageInput" maxlength="2000"
               placeholder="Write a message..."
               aria-label="Message" required>
        <button id="sendBtn" class="btn send"
                type="submit">➤</button>
      </form>

      <div id="chatStatus" class="status" role="status"></div>
    </section>

    <footer>
      N-Chat · Global Community · SK-Cloud-Core
    </footer>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    /*
      STEP 1:
      Firebase Console → Project settings → Your apps → Config.
      Replace the placeholder values below with your existing
      nchat-2cc6e Web App configuration.
    */

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "nchat-2cc6e.firebaseapp.com",
      projectId: "nchat-2cc6e",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
      messagingSenderId: "PASTE_YOUR_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const $ = id => document.getElementById(id);

    const authView = $("authView");
    const chatView = $("chatView");
    const authForm = $("authForm");
    const authStatus = $("authStatus");
    const chatStatus = $("chatStatus");
    const submitBtn = $("submitBtn");

    let app;
    let auth;
    let db;
    let signupMode = false;
    let currentUser = null;
    let profileData = null;
    let unsubscribeMessages = null;
    let submittingMessage = false;

    function showStatus(element, message, isError = false) {
      element.textContent = message;
      element.className = "status " + (isError ? "error" : "success");
    }

    function friendlyError(error) {
      const messages = {
        "auth/invalid-api-key":
          "Firebase API key is invalid. Check your Web App configuration.",
        "auth/api-key-not-valid":
          "Firebase API key is invalid. Check the API key in Firebase Console.",
        "auth/operation-not-allowed":
          "Enable Email/Password sign-in in Firebase Authentication.",
        "auth/invalid-credential":
          "Email or password is incorrect.",
        "auth/email-already-in-use":
          "This email is already registered. Please sign in.",
        "auth/weak-password":
          "Choose a stronger password.",
        "auth/invalid-email":
          "Enter a valid email address.",
        "auth/network-request-failed":
          "Network error. Check your internet connection.",
        "permission-denied":
          "Firestore denied access. Check your Firestore Security Rules."
      };

      return messages[error.code] ||
        `${error.code || "Error"}: ${error.message || "Something went wrong."}`;
    }

    function validateFirebaseConfig() {
      return firebaseConfig.apiKey &&
        firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY" &&
        firebaseConfig.appId &&
        firebaseConfig.appId !== "PASTE_YOUR_APP_ID" &&
        firebaseConfig.messagingSenderId &&
        firebaseConfig.messagingSenderId !== "PASTE_YOUR_SENDER_ID";
    }

    if (!validateFirebaseConfig()) {
      showStatus(
        authStatus,
        "Setup required: add the existing Firebase Web App config in this file.",
        true
      );
    } else {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        onAuthStateChanged(auth, async user => {
          currentUser = user;

          if (unsubscribeMessages) {
            unsubscribeMessages();
            unsubscribeMessages = null;
          }

          if (!user) {
            profileData = null;
            chatView.classList.add("hidden");
            authView.classList.remove("hidden");
            return;
          }

          try {
            const userRef = doc(db, "users", user.uid);
            const snapshot = await getDoc(userRef);

            profileData = snapshot.exists()
              ? snapshot.data()
              : {
                  displayName: user.displayName || "N-Chat User",
                  username: ""
                };

            $("welcomeName").textContent =
              profileData.displayName || "N-Chat User";

            $("welcomeUsername").textContent =
              profileData.username
                ? "@" + profileData.username
                : user.email;

            authView.classList.add("hidden");
            chatView.classList.remove("hidden");

            listenForMessages();
          } catch (error) {
            showStatus(chatStatus, friendlyError(error), true);
          }
        });
      } catch (error) {
        showStatus(authStatus, friendlyError(error), true);
      }
    }

    function setSignupMode(value) {
      signupMode = value;

      $("authTitle").textContent =
        value ? "Create Account" : "Welcome Back";

      $("authSubtitle").textContent =
        value ? "Join the N-Chat community." : "Sign in to your community.";

      $("nameField").classList.toggle("hidden", !value);
      $("usernameField").classList.toggle("hidden", !value);

      $("displayName").required = value;
      $("username").required = value;

      $("password").autocomplete =
        value ? "new-password" : "current-password";

      submitBtn.textContent = value ? "Create Account" : "Sign In";
      $("switchText").textContent =
        value ? "Already registered?" : "New to N-Chat?";

      $("switchBtn").textContent =
        value ? "Sign In" : "Create Account";

      showStatus(authStatus, "");
    }

    $("switchBtn").addEventListener("click", () => {
      setSignupMode(!signupMode);
    });

    authForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!auth || !db) {
        showStatus(authStatus, "Firebase configuration is incomplete.", true);
        return;
      }

      const email = $("email").value.trim();
      const password = $("password").value;

      submitBtn.disabled = true;
      showStatus(authStatus, "Please wait...");

      try {
        if (signupMode) {
          const displayName = $("displayName").value.trim();
          const username = $("username").value.trim().toLowerCase();

          if (!/^[a-z0-9_]{3,20}$/.test(username)) {
            throw new Error(
              "Username must contain 3–20 letters, numbers or underscores."
            );
          }

          if (!displayName) {
            throw new Error("Enter your profile name.");
          }

          /*
            Note: this basic version checks username availability,
            but a production app should reserve usernames atomically
            using a Firestore transaction or trusted backend.
          */
          const usernameRef = doc(db, "usernames", username);
          const usernameSnapshot = await getDoc(usernameRef);

          if (usernameSnapshot.exists()) {
            throw new Error("This username is already taken.");
          }

          const credential = await createUserWithEmailAndPassword(
            auth, email, password
          );

          await updateProfile(credential.user, { displayName });

          await setDoc(doc(db, "users", credential.user.uid), {
            uid: credential.user.uid,
            displayName,
            username,
            email,
            createdAt: serverTimestamp()
          });

          await setDoc(usernameRef, {
            uid: credential.user.uid
          });

          showStatus(authStatus, "Account created successfully.");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showStatus(authStatus, "Signed in successfully.");
        }
      } catch (error) {
        showStatus(authStatus, friendlyError(error), true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    function listenForMessages() {
      if (!db) return;

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      unsubscribeMessages = onSnapshot(
        messagesQuery,
        snapshot => {
          const box = $("chatMessages");
          box.replaceChildren();

          if (snapshot.empty) {
            const empty = document.createElement("p");
            empty.className = "muted";
            empty.textContent = "No messages yet. Start the conversation!";
            box.appendChild(empty);
            return;
          }

          const fragment = document.createDocumentFragment();

          snapshot.docs.reverse().forEach(messageDoc => {
            const message = messageDoc.data();

            const item = document.createElement("article");
            item.className = "message";

            const author = document.createElement("div");
            author.className = "author";
            author.textContent = message.displayName || "N-Chat User";

            const body = document.createElement("div");
            body.className = "body";
            body.textContent = message.text || "";

            const time = document.createElement("div");
            time.className = "time";

            if (message.createdAt?.toDate) {
              time.textContent =
                message.createdAt.toDate().toLocaleString();
            } else {
              time.textContent = "Sending...";
            }

            item.append(author, body, time);
            fragment.appendChild(item);
          });

          box.appendChild(fragment);
          box.scrollTop = box.scrollHeight;
        },
        error => {
          showStatus(chatStatus, friendlyError(error), true);
        }
      );
    }

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser || !db || submittingMessage) return;

      const input = $("messageInput");
      const message = input.value.trim();

      if (!message) return;

      submittingMessage = true;
      $("sendBtn").disabled = true;

      try {
        await addDoc(collection(db, "messages"), {
          uid: currentUser.uid,
          displayName: profileData?.displayName ||
            currentUser.displayName || "N-Chat User",
          text: message,
          createdAt: serverTimestamp()
        });

        input.value = "";
        showStatus(chatStatus, "");
      } catch (error) {
        showStatus(chatStatus, friendlyError(error), true);
      } finally {
        submittingMessage = false;
        $("sendBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      if (!auth) return;

      try {
        await signOut(auth);
        showStatus(authStatus, "You have signed out.");
      } catch (error) {
        showStatus(chatStatus, friendlyError(error), true);
      }
    });
  </script>
</body>
</html>
